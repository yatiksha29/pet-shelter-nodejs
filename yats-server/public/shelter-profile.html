<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>

  <title>Document</title>

  <script>
    function doPrev(ref, prev) {
      const [file] = ref.files
      if (file) {
        prev.src = URL.createObjectURL(file)
      }
    }
  </script>
  <script>
    function doPreview(ref, preview) {
      const [file] = ref.files
      if (file) {
        preview.src = URL.createObjectURL(file)
      }
    }
  </script>
  <script>
    $(document).ready(function () {
      let active=localStorage.getItem("activeUser");
      $("#auser").html(active);
      $("#txtEmail").val(active).prop("disabled",true);
      
      $("#sfetch").click(function () {
        let em = $("#txtEmail").val();

        let config = {
          url: "/fetch-record",
          type: "get",
          data: {
            emailKuch: em,

          }
        }
        $.ajax(config).done(function (respJSONAry) 
        {
          $("#txtName").val(respJSONAry[0].name);
          $("#txtCon").val(respJSONAry[0].contact);
          $("#txtAdd").val(respJSONAry[0].address);
          $("#txtCity").val(respJSONAry[0].city);
          $("#txtWeb").val(respJSONAry[0].website);
          $("#txtSin").val(respJSONAry[0].since);
          $("#txtSel").val(respJSONAry[0].selpets);
          $("#prev").attr("src", "uploads/" + respJSONAry[0].idpic);
          $("#hdn").val(respJSONAry[0].idpic);
          $("#preview").attr("src", "uploads/" + respJSONAry[0].shelpic);
          $("#hdn1").val(respJSONAry[0].shelpic);

        }).fail(function (err) {
          $("#err").html(resp);
        });
      });
    })
  </script>
  <script>
    function doAdd(opt,txtspets)
    {
      var option=opt.value;
      var pets=txtSel.value;
      let Selected=pets.includes(option);
      if(Selected!=1)
      {
        txtSel.value=txtSel.value+" "+option+";";      
      }
    }
  </script>

</head>

<body class="p-3 mb-2 bg-info-subtle text-emphasis-info">
  <div class="container" >
    <div class="p-3 mb-2 bg-body text-body">
    <nav class="navbar navbar-expand-lg bg-success p-2 text-dark bg-opacity-50 ">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="pics/petLogo3.webp" alt="Logo" class="rounded-circle" width="70" height="60" class="d-inline-block align-text-top">
          Cozy Cove
        </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
              aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
          </button>
          <span style="float:right;">Welcome: <span id="auser"></span> </span>
      </div>
  </nav>
    <div class="header">
      <center><br><h2 class="title">Shelter Providers Details</h2></center>
    </div>

    <form class="row g-3" method="post" enctype="multipart/form-data">
      <input type="hidden" id="hdn" name="hdn">
      <input type="hidden" id="hdn1" name="hdn1">
      <div class="row g-3">
        <div class="col-md-9">
          <label for="" class="form-label">Email Id</label>
          <input type="email" class="form-control" name="txtEmail" id="txtEmail">
        </div>
        <div class="col-md-3">
          <button type="button" class="btn btn-primary" name="sfetch" id="sfetch">Fetch</button>
        </div>
      
      <div class="row g-3">
        <div class="col-md-6">
          <label for="" class="form-label">Name</label>
          <input type="text" class="form-control" placeholder="Enter your name" name="txtName" id="txtName">
        </div>


        <div class="col-md-6">
          <label for="" class="form-label">Contact Number</label>
          <input type="text" class="form-control" name="txtCon" id="txtCon">
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-9">
          <label for="inputAddress" class="form-label">Shelter Address</label>
          <input type="text" class="form-control" name="txtAdd" id="txtAdd">
        </div>

        <div class="col-md-3">
          <label for="" class="form-label">City/Location</label>
          <input type="text" class="form-control" name="txtCity" id="txtCity">
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-9">
          <label for="" class="form-label">Website</label>
          <input type="text" class="form-control" name="txtWeb" id="txtWeb">
        </div>
        <div class="col-md-3">
            <label for="" class="form-label">Since/Estd.</label>
            <input type="text" class="form-control" placeholder="Enter your name" name="txtSin" id="txtSin">
          </div>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
            <label for="inputcombo" class="form-label">Pet Types</label>
            <select  class="form-select" name="txtP" id="txtP" onchange="doAdd(this,txtSel)" multiple>
              <option value="">Choose...</option>
              <option value="dog">Dog</option>
              <option value="cat">Cat</option>
              <option value="cow">Cow</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="" class="form-label">Selected Pets</label>
            <input type="text" class="form-control" name="txtSel" id="txtSel">
          </div>
      </div>
      <div class="row g-3">
      <div class="col-md-6">
        <label for="formFile" class="form-label">Profile Pic</label>
        <input class="form-control" type="file" name="idpic" id="idpic" onchange="doPrev(this,prev);">
        <img src="" id="prev" width="150px" height="150px" alt="" style="margin-top: 50px">
      </div>
      

          <div class="col-md-6">
        <label for="formFile" class="form-label">Shelter Pics</label>
        <input class="form-control" type="file" name="shelpic" id="shelpic" onchange="doPreview(this,preview);">
        <img src="" id="preview" width="150px" height="150px" alt="" style="margin-top: 50px">
      </div>
      </div>


      <div class="row g-3">
        <div class="col-3">
          <button type="submit" class="btn btn-primary" value="save " formaction="/ssave">Send to Server</button>
        </div>
        <div class="col-3">
          <button type="submit" class="btn btn-primary" value="update" formaction="/supdate">Modify Data</button>
        </div>
      </div>
    </form>

    </div>
  </div>

</body>

</html>
