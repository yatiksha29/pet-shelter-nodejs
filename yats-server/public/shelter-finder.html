<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <title>Document</title>
    <script>
        $(document).ready(function () {
      let active=localStorage.getItem("activeUser");
      $("#auser").html(active);
      $("#txtEmail").val(active).prop("disabled",true);
        })
        var module = angular.module("mymodule", []);
        var controller = module.controller("mycontroller", function ($scope, $http) {
            $scope.jsonAllCities = [];
            $scope.doFetchCities = function () {
                let path = "/Fetch-all-cities";
                $http.get(path).then(doneFx, failFx);
                function doneFx(response) {
                    $scope.jsonAllCities = response.data;
                }
                function failFx(response) {
                    alert(response.data);
                }
            }

            // $scope.doShowSel = function () {
            //     alert($scope.selId);
            // }

            //-------------------Fetch all cities-----------------
            $scope.jsonData = [];
            $scope.doShowSel = function () {
                var obj1 = $scope.selId;
                let path = "/fetch-shfinder-record?citykuch=" + obj1;

                $http.get(path).then(doneFx, failFx);
                function doneFx(response) {

                    $scope.jsonData = response.data;
                }
                function failFx(response) {
                    alert(response.data);
                }
            }
        })
    </script>

</head>

<body class="p-3 mb-2 bg-info-subtle text-emphasis-info" ng-app="mymodule" ng-controller="mycontroller" ng-init="doFetchCities();">
    <div class="container">
        <div class="p-3 mb-2 bg-body text-body">
            <nav class="navbar navbar-expand-lg bg-success p-2 text-dark bg-opacity-50">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">
                        <img src="pics/petLogo3.webp" alt="Logo" class="rounded-circle" width="70" height="60"
                            class="d-inline-block align-text-top">
                        Cozy Cove
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <span style="float:right;">Welcome: <span id="auser"></span> </span>
                </div>
            </nav>
            <div class="input-group">
                <div class="w-10 p-3">
                    <label class="form-label">Cities</label>
                </div>
                <div class="w-75 p-3">
                    <select class="form-select" ng-change="doShowSel();" ng-model="selId" name="txtCity" id="txtCity">
                        <option value="">Choose...</option>
                        <option ng-repeat="obj in jsonAllCities" value={{obj.city}}>{{obj.city}}</option>
                    </select>


                    <div class="container" style="margin-top: 50px; margin-right:50px">
                        <div class="row">
                            <div class="col-md-3" ng-repeat="obj in jsonData">
                                <div class="card  border-primary mb-3" style="max-width: 20rem; height:27rem;">
                                    <center> <img src="uploads/{{obj.shelpic}}"  height="100" width="100" alt="...">
                                    </center>
                                    <div class="card-body">
                                        <center>
                                        <h5 class="card-title">{{obj.name}}</h5>
                                        </center>
                                        <h6 class="card-subtitle mb-2 text-body-dark">Emailid:</h6>
                                        <p class="card-text">
                                            {{obj.emailid}}
                                        </p>
                                        <h6 class="card-subtitle mb-2 text-body-dark">Website:</h6>
                                        <p class="card-text">
                                            {{obj.website}}
                                        </p>
                                        <h6 class="card-subtitle mb-2 text-body-dark">City:</h6>
                                        <p class="card-text">
                                            {{obj.city}}
                                        </p>
                                        <button class="btn btn-primary">More Details</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
</body>

</html>
