<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>

  <title>Document</title>
  <script>
    $(document).ready(function () {
      let active = localStorage.getItem("activeUser");
      $("#auser").html(active);
      if (active == null) {
        location.href = "index.html";
        return;
      }
      alert(active);
      $("#btnLogout").click(function () {
        localStorage.removeItem("activeUser");
        location.href = "index.html";
        return;
      })

      $("#changePass").blur(function () {
        var email1 = $("#changeEmail").val();
        var pwd1 = $("#changePass").val();
        alert(email1, pwd1);
        let config = {
          url: "/chkpwd",
          type: "get",
          data: {
            emailkuch: email1,
            pwdkuch: pwd1,
          }
        }
        $.ajax(config).done(function (resp, respJSONAry) {
          if (resp.length != "") {
            $("#txtNew").attr("disabled", false);
            $("#txtRe").attr("disabled", false);
          }
          else {
            $("#txtNew").attr("disabled", true);
            $("#txtRe").attr("disabled", true);
            alert("Email or Password is Incorrect");
          }
        }).fail(function (err) {
          $("err").html(resp);
        });
      });
      $("#txtRe").blur(function () {
        let sub1 = $("#txtNew").val();
        let sub2 = $("#txtRe").val();
        if (sub1 == sub2) {
          $("#btnU").attr("disabled", false);
        }
        else
          $("#btnU").attr("disabled", true);
      });
    });
  </script>

</head>

<body class="p-3 mb-2 bg-info-subtle text-emphasis-info">
  <div class="container">
    <div class="p-3 mb-2 bg-body text-body">
      <nav class="navbar navbar-expand-lg  bg-success p-2 text-dark bg-opacity-50">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img src="pics/petLogo3.webp" alt="Logo" class="rounded-circle" width="70" height="60"
              class="d-inline-block align-text-top">
            Cozy Cove
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <span style="float:right;">Welcome: <span id="auser"></span> </span>

        </div>
      </nav>


      <div class="row g-3" style="margin-left: 30px; margin-top: 50px;">
        <div class="card" style="width: 18rem;margin-right: 30px;">
          <img src="pics/pet3.avif" class="rounded-circle" class="card-img-top" alt="...">
          <div class="card-body">
            <a href="/ownerPro" class="btn btn-primary">Profile Information</a>
          </div>
        </div>
        <div class="card" style="width: 18rem;margin-right: 30px;">
          <img src="pics/pet3.avif" class="card-img-top" alt="...">
          <div class="card-body">
            <a href="/search-shelter" class="btn btn-primary">Search Shelter</a>
          </div>
        </div>
        <div class="card" style="width: 18rem;margin-right: 30px;">
          <img src="pics/pet3.avif" class="card-img-top" alt="...">
          <div class="card-body">
            <a href="#" class="btn btn-primary" id="osetting" data-bs-target="#mymodel"
              data-bs-toggle="modal">Settings</a>
          </div>
        </div>
        <div class="card" style="width: 18rem;">
          <img src="pics/pet3.avif" class="card-img-top" alt="...">
          <div class="card-body">
            <a href="#" class="btn btn-primary" id="btnLogout" value="Logout">Logout</a>
          </div>
        </div>
      </div>

      <!----Settings---->
      <div class="modal" id="mymodel">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Settings</h5>
              <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form>
                <div class="mb-3">
                  <label class="form-label">Email Id</label>
                  <input type="text" class="form-control" id="changeEmail" name="changeEmail">
                </div>
                <div class="mb-3">
                  <label class="form-label">Old Password</label>
                  <input type="text" class="form-control" id="changePass" name="changePass">
                </div>
                <div class="mb-3">
                  <label class="form-label">New Password</label>
                  <input class="form-control" type="text" name="txtNew" id="txtNew" disabled>
                </div>
                <div class="mb-3">
                  <label class="form-label">Recheck Password</label>
                  <input class="form-control" type="text" name="txtRe" id="txtRe" disabled>
                </div>
                <button type="submit" class="btn btn-primary" formaction="/update-password" id="btnU"
                  disabled>Update</button>
              </form>
            </div>

          </div>
        </div>
      </div>
    </div>
</body>

</html>
